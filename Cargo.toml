[package]
name = "probe-proxy"
version = "0.3.0"
edition = "2021"
description = "ProbeOps Forward Proxy - Built on Derusted"

[[bin]]
name = "probe-proxy"
path = "src/main.rs"

[dependencies]
# Core proxy library
derusted = { git = "https://github.com/kumarimlab/derusted", branch = "main" }

# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# HTTP types (needed for extensions)
http = "1.0"
http-body-util = "0.1"
hyper = { version = "1.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
h2 = "0.4"

# TLS
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"

# JWT (for extended claims)
jsonwebtoken = "9.2"
base64 = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Rate limiting (for extended rate limiter)
lru = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"
bytes = "1.5"

# HTTP client for logging
reqwest = { version = "0.11", features = ["json"] }

# Configuration
dotenv = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
