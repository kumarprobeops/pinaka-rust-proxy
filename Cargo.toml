[package]
name = "probe-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# HTTP server (v1.1 for HTTP/1.1 fallback)
hyper = { version = "1.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# HTTP/2 framing (direct access to streams)
h2 = "0.4"

# TLS with ALPN support
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"

# HTTP types
http = "1.0"
http-body-util = "0.1"

# JWT authentication
jsonwebtoken = "9.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
futures = "0.3"
bytes = "1.5"
pin-project = "1.1"

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Rate limiting
lru = "0.12"

# Configuration
dotenv = "0.15"

# HTTP client (for upstream connections)
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
# For h2 client test harness
rustls-native-certs = "0.7"

[[bin]]
name = "h2_connect_load"
path = "tests/h2_connect_load.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
